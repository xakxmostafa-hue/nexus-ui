<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus UI - FiveM Menu Preview</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            background: transparent !important;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            color: #fff;
        }

        /* Svelte Mount Noktası */
        #app {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        /* Üst Bilgi Barı */
        .hud-header {
            position: fixed;
            top: 2vh;
            left: 2vh;
            display: flex;
            align-items: center;
            gap: 1.2vh;
            background: rgba(18, 18, 22, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 0.6vh;
            padding: 0.8vh 1.4vh;
            font-size: 1.15vh;
            color: #d1d5db;
            z-index: 100000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .hud-badge {
            background: var(--ui-main, #e74c3c);
            color: white;
            padding: 0.25vh 0.7vh;
            border-radius: 0.35vh;
            font-weight: 700;
            font-size: 1vh;
            letter-spacing: 0.05vh;
            text-transform: uppercase;
        }

        .hud-keys {
            display: flex;
            align-items: center;
            gap: 0.8vh;
        }

        .hud-key {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 0.2vh 0.6vh;
            border-radius: 0.3vh;
            font-family: monospace;
            font-size: 1vh;
            font-weight: 600;
        }

        /* Hızlı Test Paneli (Sol Alt Köşe) */
        .test-toolbox {
            position: fixed;
            bottom: 2vh;
            left: 2vh;
            z-index: 100000;
            background: rgba(16, 17, 22, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.8vh;
            padding: 1.2vh;
            width: 28vh;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .test-toolbox.collapsed {
            transform: translateY(calc(100% - 4vh));
        }

        .toolbox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            padding-bottom: 0.8vh;
            margin-bottom: 0.8vh;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 1.15vh;
            font-weight: 600;
            color: #fff;
        }

        .toolbox-header .toggle-icon {
            font-size: 1.2vh;
            transition: transform 0.25s ease;
        }

        .test-toolbox.collapsed .toggle-icon {
            transform: rotate(180deg);
        }

        .toolbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6vh;
        }

        .tb-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            font-size: 1.05vh;
            font-family: inherit;
            padding: 0.7vh 0.8vh;
            border-radius: 0.4vh;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5vh;
            text-align: center;
        }

        .tb-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-0.1vh);
        }

        .tb-btn.full-width {
            grid-column: span 2;
        }

        .tb-btn.primary {
            background: var(--ui-main, #e74c3c);
            color: #fff;
            border-color: transparent;
            font-weight: 600;
        }

        .tb-btn.primary:hover {
            opacity: 0.9;
            filter: brightness(1.1);
        }

        .color-row {
            grid-column: span 2;
            display: flex;
            gap: 0.4vh;
            margin-top: 0.4vh;
        }

        .color-dot {
            flex: 1;
            height: 1.6vh;
            border-radius: 0.3vh;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .color-dot:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div id="app"></div>

    <script src="app.js"></script>

    <script src="controller.js"></script>

</body>
</html>
